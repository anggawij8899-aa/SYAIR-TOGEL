<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Syair Togel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('background1.png') no-repeat center center fixed;
      background-size: cover;
      color: gold;
      text-align: center;
    }
    .container {
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 15px;
      display: inline-block;
      margin-top: 30px;
    }
    select, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      color: #FFD700;
    }
    .shio {
      font-weight: bold;
      font-size: 22px;
    }
    .date {
      font-size: 16px;
      margin-bottom: 10px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dashboard Syair Togel</h2>
    <div class="date" id="tanggal"></div>
    <select id="pasaran">
      <option value="">-- Pilih Pasaran --</option>
      <option value="bullseye">Bullseye</option>
      <option value="kentucky">Kentucky Lottery</option>
    </select>
    <button onclick="generate()">Submit</button>

    <div class="result" id="output"></div>
  </div>

  <script>
    // Data shio & angka (contoh, bisa ditambah sesuai kebutuhan)
    const data = {
      "bullseye": [
        {
          shio: "Kuda",
          angkaShio: "8-6-2",
          bbfs: "8-6-2-3-4-8-1",
          angkaMain: "5-9-1-3-7",
          motivasi: "Kulit lama ia tinggalkan, tanda hidup selalu berubah..."
        },
        {
          shio: "Naga",
          angkaShio: "3-7-9",
          bbfs: "1-4-7-9-2-6-8",
          angkaMain: "2-5-8-9-0",
          motivasi: "Kesempatan besar datang bila sabar menunggu..."
        }
      ],
      "kentucky": [
        {
          shio: "Kambing",
          angkaShio: "13-6-4",
          bbfs: "1-7-6-3-4-8-0",
          angkaMain: "1-7-6-2-9",
          motivasi: "Tanduk melingkar jadi mahkota..."
        }
      ]
    };

    // Tanggal otomatis
    document.getElementById("tanggal").innerText = new Date().toLocaleDateString("id-ID", {
      day: "numeric", month: "long", year: "numeric"
    });

    function generate() {
      const pasaran = document.getElementById("pasaran").value;
      const output = document.getElementById("output");

      if (pasaran && data[pasaran]) {
        const randomIndex = Math.floor(Math.random() * data[pasaran].length);
        const info = data[pasaran][randomIndex];
        output.innerHTML = `
          <div class="shio">SHIO : ${info.shio}</div>
          <p><strong>ANGKA SHIO:</strong> ${info.angkaShio}</p>
          <p><strong>BBFS:</strong> ${info.bbfs}</p>
          <p><strong>ANGKA MAIN:</strong> ${info.angkaMain}</p>
          <p>${info.motivasi}</p>
        `;
      } else {
        output.innerHTML = "<p style='color:red'>Silakan pilih pasaran dulu bosku!</p>";
      }
    }
  </script>
</body>
</html>
